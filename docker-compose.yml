version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spotify_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-spotify_analytics}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spotify_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-spotify_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spotify_analytics_backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "${APP_NAME:-Spotify Profile Analyzer}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-spotify_analytics}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: "${APP_URL:-http://localhost:8000}/api/spotify/callback"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spotify_network

  nginx-api:
    image: nginx:alpine
    container_name: spotify_analytics_api_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      - backend
    networks:
      - spotify_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spotify_analytics_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - nginx-api
    networks:
      - spotify_network

volumes:
  postgres_data:
    driver: local

networks:
  spotify_network:
    driver: bridge

